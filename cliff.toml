# ──────────────────────────────────────────────────────────────
# git-cliff configuration for URLCleanseBot
# Generates changelog from Conventional Commits
# ──────────────────────────────────────────────────────────────

[changelog]
# Header for the changelog
header = """
# Changelog

All notable changes to URLCleanseBot will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
# Template for each version
body = """
{% if version %}\n## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}\n{% else %}\n## [Unreleased]\n{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
  {% if commit.hash %}([{{ commit.hash | truncate(length=7, end="") }}](https://github.com/good-wine/urlcleansebot/commit/{{ commit.hash }})){% endif %}
  {% if commit.references %}{% for ref in commit.references %}([#{{ ref }}](https://github.com/good-wine/urlcleansebot/pull/{{ ref }})){% endfor %}{% endif %}
{% endfor %}

{% endfor %}
"""
# Footer
footer = """
---
Generated by [git-cliff](https://github.com/orhun/git-cliff)
"""

[git]
# Conventional Commits parsing
conventional_commits = true
# Filter commits
filter_unconventional = true
# Include merge commits
include_merge_commits = false
# Commit parsing
commit_parsers = [
  { message = "^(?<type>feat|fix|perf|refactor|docs|test|chore|build|ci|security|revert|style)(?:\\((?<scope>[^)]+)\\))?(?<breaking>!)?: (?<message>.*)$" },
  { message = "^(?<type>feat|fix|perf|refactor|docs|test|chore|build|ci|security|revert|style)(?:\\((?<scope>[^)]+)\\))?(?<breaking>!)?: (?<message>.*)$", body = "(?s)(?<body>.*)" }
]
# Protect against commits that don't match
protect = false

[git.tag]
# Tag pattern
pattern = "v*"
# Sort tags
sort_by = "version"
# Pre-release tags
pre_release = "pre"

[changelog.groups]
# Order of groups in changelog
order = ["Breaking Changes", "Added", "Changed", "Deprecated", "Removed", "Fixed", "Security", "Performance", "Refactored", "Documentation", "Testing", "Build", "CI", "Chore", "Other"]
# Group mapping from commit type
groups = {
  "Breaking Changes" = { type = ["feat", "fix", "perf", "refactor"], breaking = true },
  "Added" = { type = "feat", breaking = false },
  "Changed" = { type = ["refactor", "perf"], breaking = false },
  "Deprecated" = { type = "chore", scope = ["deprecated"] },
  "Removed" = { type = ["refactor", "chore"], scope = ["removed"] },
  "Fixed" = { type = "fix", breaking = false },
  "Security" = { type = "security" },
  "Performance" = { type = "perf", breaking = false },
  "Refactored" = { type = "refactor", breaking = false },
  "Documentation" = { type = "docs" },
  "Testing" = { type = "test" },
  "Build" = { type = "build" },
  "CI" = { type = "ci" },
  "Chore" = { type = "chore" },
  "Other" = { type = ["revert", "style"] }
}

# Scope display names
[changelog.scope]
# Rename scopes for display
rename = {
  "sanitizer" = "Sanitizer",
  "db" = "Database",
  "telegram" = "Telegram Bot",
  "ai" = "AI/ML",
  "config" = "Configuration",
  "deploy" = "Deployment",
  "docs" = "Documentation",
  "deps" = "Dependencies",
  "metrics" = "Metrics",
  "i18n" = "Internationalization",
  "security" = "Security",
  "redirects" = "Redirects",
  "bench" = "Benchmarks",
  "release" = "Release"
}

# Show scope in commit message
show_scope = true

[changelog.commit]
# Parse commit message for references (PR numbers, issue numbers)
parse_trailers = true
# Trailer patterns
trailers = ["BREAKING CHANGE", "Closes", "Fixes", "Refs", "See also", "Co-authored-by"]
# Include commit hash
include_hash = true
# Hash length
hash_length = 7
# Sort commits
sort_by = "scope"

# Template for commit message
message = "{{ message }}"

# Release template (for release notes)
[changelog.release]
# Include in release notes
include = true
# Template for release notes
template = """
## What's Changed
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} {% if commit.hash %}([{{ commit.hash | truncate(length=7, end="") }}](https://github.com/good-wine/urlcleansebot/commit/{{ commit.hash }})){% endif %} {% if commit.references %}{% for ref in commit.references %}(#{{ ref }}){% endfor %}{% endif %}
{% endfor %}
{% endfor %}

## Full Changelog
https://github.com/good-wine/urlcleansebot/compare/{{ previous_tag }}...{{ tag }}
"""