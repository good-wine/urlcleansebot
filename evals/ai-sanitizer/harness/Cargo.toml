[package]
name = "eval-harness"
version = "0.1.0"
edition = "2024"
description = "AI Evaluation Harness for URLCleanseBot AI Sanitizer"
license = "MIT"

[[bin]]
name = "eval-harness"
path = "src/main.rs"

[dependencies]
# Core evaluation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
url = "2.5"
regex = "1.12"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
once_cell = "1.19"
csv = "1.3"
tabled = "0.16"
toml = "0.8"

# LLM Judge
async-openai = "0.27"

# Testing
[dev-dependencies]
tempfile = "3.16"
tokio-test = "0.4"
pretty_assertions = "1.4"


[profile.release]
lto = true
codegen-units = 1
panic = "abort"