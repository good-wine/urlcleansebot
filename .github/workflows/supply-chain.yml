name: Supply Chain Security (Main Branch)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # 1. Source SBOM Generation
  # ============================================================
  source-sbom:
    name: Generate Source SBOM
    runs-on: ubuntu-latest
    outputs:
      sbom-spdx: ${{ steps.upload-spdx.outputs.sbom-path }}
      sbom-cdx: ${{ steps.upload-cdx.outputs.sbom-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Generate SPDX SBOM from source
        id: syft-spdx
        run: |
          syft dir:. -o spdx-json=sbom.spdx.json
          echo "sbom-path=sbom.spdx.json" >> $GITHUB_OUTPUT

      - name: Generate CycloneDX SBOM from source
        id: syft-cdx
        run: |
          syft dir:. -o cyclonedx-json=sbom.cyclonedx.json
          echo "sbom-path=sbom.cyclonedx.json" >> $GITHUB_OUTPUT

      - name: Upload SPDX SBOM artifact
        id: upload-spdx
        uses: actions/upload-artifact@v4
        with:
          name: sbom-source-spdx
          path: sbom.spdx.json
          retention-days: 90

      - name: Upload CycloneDX SBOM artifact
        id: upload-cdx
        uses: actions/upload-artifact@v4
        with:
          name: sbom-source-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  # ============================================================
  # 2. Dependency Audit (cargo-audit + cargo-deny)
  # ============================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-audit
        run: cargo audit --deny warnings

      - name: Run cargo-deny check
        run: cargo deny check all